<!doctype html>
<html lang="vi" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poly Dựng Bài</title>
<link rel="icon" href="/ui/poly.png">
<style>
/*FONTS*/
:root{
  /* theme Polysto (app.polystorevn.com): xám trung tính + xanh lá */
  --bg:#121212; --side:#171717; --panel:#1c1c1c; --panel2:#212121; --hover:#262626; --act:#2c2c2c;
  --line:#262626; --line2:#2e2e2e; --edge:#3a3a3a; --input:#161616;
  --text:#ededed; --mut:#9a9a9a; --dim:#808080;
  --g:#1f8f4e; --g2:#23a159; --gl:#7bf1a8; --gsoft:#1d3f2b; --gbadge:#1c2821; --gnote:#131f18; --gs:#c9f5dc;
  --y:#ffb900; --ysoft:#322819; --ytext:#ffd27a;
  --r:#ff4e36; --rsoft:#2b1714; --rline:#4d2420; --rtext:#ffb4a8; --o:#ffb900;
  --rad:10px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Be Vietnam Pro","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gl)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2e2e2e;border-radius:10px;border:2px solid var(--bg)}

/* ---------- thanh trên ---------- */
.top{display:flex;align-items:center;gap:14px;height:56px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--side);flex:0 0 56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em;line-height:1.2}
.logo{width:30px;height:30px;border-radius:9px;background:var(--g);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.brand small{display:block;font-weight:500;color:var(--dim);font-size:11px;letter-spacing:.14em}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);font-size:12.5px;color:var(--mut);background:var(--panel);white-space:nowrap}
@media (max-width:1100px){.top .chip .tk{display:none}}
.chip.tgc{cursor:pointer;margin-right:8px;font-family:inherit}
.chip.tgc:hover{border-color:var(--g);color:var(--tx)}
.chip.hcc{cursor:pointer;font-family:inherit}
.chip.hcc:hover{border-color:var(--g);color:var(--tx)}
.chip .tk{color:var(--dim);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kmtt{border-top:1px solid var(--line);margin-top:10px;padding-top:12px;display:grid;gap:8px}
.kmtt label{display:grid;gap:4px;font-size:12.5px;color:var(--mut)}
.kmtt .in{height:34px;padding:0 10px;color:var(--tx);background:var(--input)}
.kmtt select.in option{background:var(--panel);color:var(--tx)}
.kmtt .err:empty{display:none}
.kmtt label.kmck{display:flex;gap:8px;align-items:center;color:var(--tx)} .kmtt label.kmck input{accent-color:var(--g);width:16px;height:16px}
.kmtt details{font-size:12.5px;color:var(--mut)} .kmtt details .in{margin-top:6px;width:100%}
.kmtt .acts{display:flex;gap:8px;justify-content:flex-end}
.mbox{max-height:92vh;overflow:auto}
.post .pnote .hen{color:var(--y)}
.chatb{margin-top:8px;border:1px solid var(--line2);border-radius:12px;background:var(--panel);padding:8px}
.chatl{max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.chatl:empty{display:none}
.chatl .cm{max-width:85%;padding:7px 11px;border-radius:12px;font-size:13px;line-height:1.45;white-space:pre-wrap}
.chatl .cm.fen{align-self:flex-end;background:var(--gsoft, rgba(46,160,90,.18));color:var(--tx)}
.chatl .cm.ai{align-self:flex-start;background:var(--panel2);color:var(--mut)}
.chatl .cm a{color:var(--gl)}
.chatl .cm .dot{display:inline-block;vertical-align:middle;margin-right:4px}
.chatin{display:flex;gap:8px;margin-top:6px}
.chatin .in{flex:1;height:38px;padding:0 12px}
.chatl:not(:empty) + .chatin{margin-top:8px}
.mbox .hq{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.mbox .hq .q{border:1px solid var(--edge);background:var(--input);border-radius:10px;padding:0 12px;height:36px;font-weight:600;font-size:13px;color:var(--mut);cursor:pointer}
.mbox .hq .q:hover{border-color:var(--g);color:var(--tx)}
.mbox input[type=datetime-local].in{height:36px;padding:0 10px;color:var(--tx)}
.kmrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.kmrow:first-of-type{border-top:0}
.kmrow .dot{margin-top:6px}
.kmrow b{font-weight:600;font-size:13.5px}
.kmrow small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.chip .btn.sm{height:22px;padding:0 10px;margin:0 -7px 0 4px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:0 0 auto}
.dot.ok{background:var(--g)} .dot.warn{background:var(--o)} .dot.err{background:var(--r)}
.dot.run{background:var(--gl);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,143,78,.6)}70%{box-shadow:0 0 0 8px rgba(31,143,78,0)}100%{box-shadow:0 0 0 0 rgba(31,143,78,0)}}

/* ---------- nút ---------- */
.btn{border:1px solid var(--line2);background:var(--panel2);padding:8px 14px;border-radius:10px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:var(--edge);background:var(--hover)}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff}
.btn.pri:hover{background:var(--g2);border-color:var(--g2)}
.btn.bad{color:var(--rtext);border-color:var(--rline);background:var(--rsoft)}
.btn.bad:hover{background:#3a1d19;border-color:#6b2a22}
.btn.ghost{background:transparent}
.btn:disabled{pointer-events:none;opacity:.55}
.btn.pri:disabled{background:var(--panel2);border-color:var(--line2);color:var(--dim);opacity:1}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}

/* ---------- bố cục ---------- */
.wrap{flex:1;display:flex;min-height:0}
.side{width:290px;flex:0 0 290px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--side)}
.side .new{padding:14px 14px 12px;border-bottom:1px solid var(--line)}
.side .new .btn{width:100%;padding:11px}
.side .new .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.side .new .row2 .btn{padding:7px 4px}
.sbtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:10px 10px 6px;border-bottom:1px solid var(--line)}
.sbtabs button{border:0;background:none;color:var(--mut);font:inherit;font-size:12px;font-weight:600;padding:7px 2px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15}
.sbtabs button b{font-size:14px;color:var(--tx)}
.sbtabs button:hover{background:var(--hover)}
.sbtabs button.on{background:var(--gsoft, rgba(46,160,90,.16));color:var(--gl)}
.sbtabs button.on b{color:var(--gl)}
.ji.co-bia{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start}
.ji .bia{width:36px;height:48px;border-radius:5px;object-fit:cover;background:var(--panel2);border:1px solid var(--line)}
.ji .bia.trong{display:block}
.ji .mt2{font-size:11.5px;color:var(--mut);margin-top:3px}
.ji .mt2.hen{color:var(--y)} .ji .mt2.ok{color:var(--gl)}
.nhbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 4px}
.nhbar h1{margin:0}
.nhbtn{display:flex;gap:8px;flex-wrap:wrap}
.ji .bia.nhb{display:flex;align-items:center;justify-content:center;font-size:17px}
.nhtabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;align-items:center}
.nht{display:inline-flex;align-items:center;gap:6px;max-width:240px;height:32px;padding:0 6px 0 11px;border:1px solid var(--line2);background:var(--panel);border-radius:9px;cursor:pointer;font-size:12.5px;color:var(--mut)}
.nht:hover{border-color:var(--g);color:var(--tx)}
.nht.on{border-color:var(--g);background:var(--gsoft, rgba(46,160,90,.14));color:var(--tx);font-weight:600}
.nht .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nht .ic{font-size:12px}
.nht .x{border:0;background:none;color:var(--dim);cursor:pointer;font-size:11px;padding:2px 4px;border-radius:5px}
.nht .x:hover{color:var(--tx);background:var(--line)}
.nhadd{height:32px;padding:0 12px;border:1px dashed var(--line2);background:none;border-radius:9px;color:var(--mut);cursor:pointer;font:inherit;font-size:12.5px}
.nhadd:hover{border-color:var(--g);color:var(--tx)}
.mbox.wide{width:min(780px,94vw)}
.lsbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.lsbar .chips{margin:0}
.lsbar .in{flex:1;min-width:180px;height:34px;padding:0 10px}
.lsit{border:1px solid var(--line2);background:var(--panel2);border-radius:10px;flex:0 0 auto}
.lsit.on{border-color:var(--g)}
.lshd{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;width:100%;background:none;border:0;padding:9px 12px;color:var(--tx);font:inherit;cursor:pointer}
.lshd b{font-size:13.5px}
.lshd span{font-size:12px;color:var(--mut)}
.lshd .tag{font-size:11px;border-radius:99px;padding:0 7px;margin-left:4px;background:var(--line);color:var(--mut)}
.lshd .tag.v{background:var(--ysoft);color:var(--o)}
.lsbd{padding:0 12px 12px}
.lsbd pre{white-space:pre-wrap;font:inherit;font-size:13px;line-height:1.5;color:var(--mut);margin:0 0 10px;max-height:38vh;overflow:auto;background:var(--input);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.lsbd .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.lsbd .lsgy{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;align-items:center;font-size:12.5px;color:var(--mut)}
.lsbd .lsgy button{border:1px solid var(--line2);background:var(--panel);color:var(--tx);border-radius:99px;padding:4px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.lsbd .lsgy button:hover{border-color:var(--g)}
.vb{display:flex;gap:8px;margin-bottom:6px}
.vb .in{flex:1}
.vb .btn{white-space:nowrap}
.vbst{font-size:12.5px;color:var(--mut);line-height:1.5;margin:0 0 12px;min-height:4px}
.vbst a{color:var(--gl)}
.vbst .vbtr{color:var(--ytext);margin-top:3px}
.vbst .vbtrung{color:var(--rtext);background:var(--rsoft);border:1px solid var(--rline);border-radius:10px;padding:8px 10px}
.vbst .vbgy{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.vbst .vbgy span{color:var(--mut)}
.vbst .vbgy button{border:1px solid var(--line2);background:var(--panel2);color:var(--tx);border-radius:99px;padding:4px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.vbst .vbgy button:hover{border-color:var(--g)}
.vbst .vbhint{color:var(--dim);margin-top:6px}
.vbst .dot{display:inline-block;vertical-align:middle;margin-right:4px}
.mbox .pnote{margin:0 0 10px;color:var(--dim);font-size:12.5px;line-height:1.45}
.cslist{max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.csit{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line2);background:var(--panel2);border-radius:10px;padding:9px 12px;cursor:pointer;color:var(--tx);font:inherit;width:100%}
.csit:hover{border-color:var(--g)}
.csit b{font-size:13.5px}
.csit span{font-size:12px;color:var(--mut)}
.csit small{font-size:11px;color:var(--dim)}
.jobs{overflow:auto;padding:4px 14px 16px;flex:1}
.grp{font-size:11px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;margin:14px 2px 6px;font-weight:700;display:flex;align-items:center;gap:6px}
.grp .n{background:var(--ysoft);color:var(--o);border-radius:99px;padding:0 7px;letter-spacing:0}
.ji{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:11px;padding:9px 8px;margin:2px 0;position:relative}
.ji:hover{background:#1f1f1f}
.ji.on{background:var(--panel2);border-color:var(--line2);box-shadow:inset 3px 0 0 var(--g)}
.ji .t{font-weight:600;font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:40px}
.ji .m{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:11.5px;margin-top:4px;flex-wrap:wrap;row-gap:2px}
.ji .jl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ji .nd{margin-left:auto;white-space:nowrap;color:var(--dim);font-size:11px}
.ji .new{position:absolute;top:10px;right:8px;font-size:10px;font-weight:800;color:#fff;background:var(--g);border-radius:6px;padding:1px 6px}
.ji .jx{position:absolute;top:6px;right:6px;display:none;width:26px;height:26px;border-radius:7px;align-items:center;justify-content:center;font-size:13px;color:var(--mut);background:var(--panel2);border:1px solid var(--line2);cursor:pointer}
.ji .jk{position:absolute;top:6px;right:38px;display:none;height:26px;padding:0 8px;border-radius:7px;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--gl);background:var(--panel2);border:1px solid var(--line2);cursor:pointer;white-space:nowrap}
.ji:hover .jk,.ji.on .jk{display:flex}
.ji:has(.jk):hover .t,.ji.on:has(.jk) .t{padding-right:128px}
.ji .jk:hover{color:#fff;background:var(--g);border-color:var(--g)}
.ji:hover .jx,.ji.on .jx{display:flex}
.ji:hover .new,.ji.on .new{display:none}
.ji .jx:hover{color:#fff;background:#7a2222;border-color:#a33}
.kn{font-size:10.5px;font-weight:800;letter-spacing:.02em;padding:2px 7px;border-radius:6px;background:var(--gbadge);color:var(--gl)}
.kn.ipad{background:var(--ysoft);color:var(--y)}
.empty{color:var(--dim);font-size:13px;padding:14px 4px}
main{flex:1;overflow:auto;min-width:0;position:relative}
.pad{max-width:1180px;margin:0 auto;padding:26px 28px 40px}

/* ---------- form ---------- */
h1{font-size:26px;margin:0 0 4px;font-weight:800;letter-spacing:-.01em}
.lead{color:var(--mut);margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:18px}
.lbl{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px;display:block}
.lbl i{text-transform:none;font-style:normal;font-weight:500;color:var(--dim);letter-spacing:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;max-width:520px}
.seg button{border:1.5px solid var(--line2);background:var(--panel);border-radius:12px;padding:9px 12px;text-align:left;display:flex;gap:10px;align-items:center;transition:.15s;color:var(--tx)}
.seg button:not(.on):hover{border-color:var(--edge);background:var(--panel2)}
.seg button .ic{width:30px;height:30px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;font-size:16px}
.seg button b{display:block;font-size:14.5px;color:var(--tx)}
.seg button span{color:var(--mut);font-size:12.5px}
.seg button.on{border-color:var(--g);background:var(--gnote);box-shadow:inset 0 0 0 1px var(--g)}
.seg button.on .ic{background:var(--g)}
.seg button[data-k=ipad].on{border-color:var(--y);background:#221c10;box-shadow:inset 0 0 0 1px var(--y)}
.seg button[data-k=ipad].on .ic{background:var(--y)}
.row{display:grid;grid-template-columns:3fr 2fr;gap:12px;margin-bottom:14px}
.in{width:100%;height:44px;background:var(--input);border:1px solid var(--edge);border-radius:11px;padding:10px 12px;outline:none;transition:border-color .15s,box-shadow .15s}
.in:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(31,143,78,.28)}
.in.bad{border-color:var(--r);box-shadow:0 0 0 3px rgba(255,78,54,.18)}
textarea.in{height:auto;resize:vertical;min-height:240px;line-height:1.55;font-size:14px}
textarea.in.small{min-height:70px}
.datec{display:flex;gap:8px}
.datec .q{border:1px solid var(--edge);background:var(--input);border-radius:11px;padding:0 12px;height:44px;font-weight:600;font-size:13px;color:var(--mut)}
.datec .q:hover{border-color:var(--g);color:var(--text)}
.datec .q.on{border-color:var(--g);color:var(--gl);background:var(--gnote)}
.datec .in{flex:1;min-width:90px}
.drop{border:1.5px dashed var(--edge);border-radius:12px;padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:84px;transition:.15s;background:var(--input)}
.drop.hot{border-color:var(--g);background:var(--gnote)}
.drop .hint{color:var(--mut);font-size:13px;flex:1;min-width:220px}
.th{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--line2);background:#000;flex:0 0 76px}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th b{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.75);border-radius:5px;font-size:11px;padding:0 6px}
.th button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.75);color:#fff;font-size:12px;line-height:22px;padding:0}
.th button:hover{background:var(--r)}
.foot{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:16px;margin:18px -28px 0;padding:14px 28px 16px;background:linear-gradient(to top,var(--bg) 78%,rgba(18,18,18,0))}
.foot .btn.pri{padding:12px 36px;font-size:15px;border-radius:12px}
.foot p{margin:0;color:var(--mut);font-size:13px}
.fast{display:flex;align-items:center;gap:7px;color:var(--text);font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
select.in.msel{height:40px;width:auto;min-width:150px;padding:0 10px;font-size:13px;font-weight:600;color:var(--tx);background:var(--input)}
select.in.msel option{background:var(--panel);color:var(--tx)}
.mlab{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);white-space:nowrap}
.fast input{accent-color:var(--g);width:16px;height:16px}
.fast i{color:var(--dim);font-style:normal;font-weight:500}
.fastc{color:var(--ytext);background:var(--ysoft);border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:700}
.foot .err:not(:empty){margin-top:4px;font-weight:600}
.err{color:#ff7a66;font-size:13px}
.err:not(:empty){margin-top:8px}
.mt{margin-top:14px}

/* ---------- banner ---------- */
.banner{margin:0 0 14px;border-radius:12px;padding:12px 14px;border:1px solid #4a3a1f;background:#241d12;color:var(--ytext);display:flex;gap:12px;align-items:center}
.banner.red{border-color:var(--rline);background:var(--rsoft);color:var(--rtext)}
.banner.ok{border-color:#1f3a2a;background:var(--gnote);color:var(--gs)}
.banner p{margin:0;flex:1}
.banner .doi{color:var(--ytext)}
.kb{margin:0 0 14px}
.kb .kl{font-size:12.5px;color:var(--mut);margin-right:8px}
.vbli{margin:6px 0 2px;padding:8px 12px 8px 26px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2);font-size:12.5px;color:var(--tx);display:grid;gap:3px}
.vbli li.cn{color:var(--y)}
.kxn{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;border:1px solid #f59e0b66;background:#f59e0b14;border-radius:10px;font-size:13px}
.kxn span{flex:1 1 220px}
.brrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin:10px 0 2px}
.brrow .kseg button{padding:4px 12px;font-size:12.5px}
.brrow a{color:var(--mut)}
/* đếm bài từng kênh ở đầu tab Chờ đăng / Đã đăng (30/10) */
.sbdem{display:flex;gap:6px;flex-wrap:wrap;padding:2px 10px 8px;font-size:12px;color:var(--mut)}
.sbdem button{border:1px solid var(--line2);border-radius:99px;padding:2px 9px;background:var(--panel2);color:var(--mut);font:inherit;font-size:12px;cursor:pointer}

function readFiles(files, arr, cb){

}

function setupPick(file, pick, arr, el){

function renderThumbs(drop, arr){

  }

  const ls0 = (d.final || '').split('\n').map(x => x.trim()).filter(Boolean);

    // lợi ích của bài để fen quyết định chọn hay không (fen 30/10 15h44): dòng LOI_ICH / CAN_NHAC trong câu cuối của Claude

function henDangGoiY(ngay){
  const out = [], n = Date.now() + 20 * 60000;
  const them = (ten, d) => { if (d.getTime() >= n && d.getTime() <= Date.now() + 10 * 864e5) out.push([ten, d]); };
  [[19, 30], [20, 30], [21, 30]].forEach(([h, m]) => { const a = new Date(); a.setHours(h, m, 0, 0); them('Tối nay ' + h + ':' + m, a); });
  [[19, 30], [20, 30]].forEach(([h, m]) => { const b = new Date(Date.now() + 864e5); b.setHours(h, m, 0, 0); them('Mai ' + h + ':' + m, b); });
  const c = ngayDang(ngay); if (c) { c.setHours(20, 0, 0, 0); if (!out.some(x => x[1].getTime() === c.getTime())) them('Ngày đăng ' + ddmm(c) + ' 20:00', c); }
  return out;
}

    m.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { k = b.dataset.k; ve(); });
    const ls = ds.map((x, i) => [x, i]).filter(([x]) => x.kenh === k);
    setH($('#csL'), ls.length ? ls.map(([x, i]) => `<button class="csit" data-i="${i}"><b>${esc(x.ten)}</b><span>${x.ngay ? 'đăng ' + esc(x.ngay) + ' · ' : ''}${x.n} slide${x.job ? ' · đã có trong app' : ''}</span><small>${esc(x.thu_muc)}</small></button>`).join('') : '<p class="pnote">Chưa có bài nào có slide.</p>');
    m.querySelectorAll('.csit').forEach(b => b.onclick = async () => {
      const x = ds[+b.dataset.i]; b.disabled = true;
      try { const r = await api('/api/bai-co-san', {kenh: x.kenh, thu_muc: x.thu_muc}); m.remove(); await loadJobs(); openJob(r.id); }
      catch(e) { toast(e.message, true); b.disabled = false; }
    });
  };
  ve();
}
/* ---------- lịch sử brief: bài đã chạy, các lần Claude viết brief, nháp đã bỏ ---------- */
const TT_BAI = {xong: 'Đã dựng', 'dang-chay': 'Đang dựng', hen: 'Đã hẹn', loi: 'Lỗi', dung: 'Đã dừng', moi: 'Mới tạo'};
function ngayGio(t){ if (!t) return ''; const d = new Date(t * 1000); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + ' ' + hm(t); }
async function lsDialog(){
  const m = document.createElement('div'); m.className = 'modal on';
  m.innerHTML = `<div class="mbox wide"><h3>Lịch sử brief</h3>
    <p class="pnote">Brief của mọi bài đã chạy, các lần bấm Viết brief (cả lần báo trùng) và nháp đã bỏ. Bấm 1 dòng để xem; Dùng lại = mở thành nháp mới, nháp đang gõ vẫn giữ.</p>
    <div class="lsbar"><div class="chips" id="lsK"></div><input class="in" id="lsQ" placeholder="Tìm chữ trong brief…"></div>
    <div class="cslist" id="lsL"><p class="pnote">Đang tải…</p></div>
    <div class="acts"><button class="btn" id="lsDong">Đóng</button></div></div>`;
  document.body.appendChild(m);
  const dong = () => m.remove();
  $('#lsDong').onclick = dong; m.onclick = e => { if (e.target === m) dong(); };
  let ds = [], k = '', q = '', mo = null;
  try { ds = (await api('/api/lich-su-brief')).ds || []; } catch(e) { setH($('#lsL'), `<p class="err">${esc(e.message)}</p>`); return; }
  const nhan = x => x.loai === 'bai' ? (TT_BAI[x.trang_thai] || x.trang_thai) + (x.trang_thai === 'hen' && x.hen_luc ? ' ' + henTxt(x.hen_luc) : '') + (x.ngay ? ' · đăng ' + x.ngay : '')
    : x.loai === 'nhap' ? 'Nháp đã bỏ'
    : x.trung ? 'Claude báo trùng, không viết' : x.bai ? 'Claude viết · đã dựng thành "' + (x.bai_ten || 'bài') + '"' : 'Claude viết · chưa dựng';
  const ve = () => {
    const dem = kk => ds.filter(x => !kk || x.kenh === kk).length;
    setH($('#lsK'), [['', 'Tất cả'], ['laptop', KENH.laptop.ic + ' Laptop'], ['ipad', KENH.ipad.ic + ' iPad']].map(([x, t]) => `<button class="${x === k ? 'on' : ''}" data-k="${x}">${t} ${dem(x)}</button>`).join(''));
    m.querySelectorAll('#lsK [data-k]').forEach(b => b.onclick = () => { k = b.dataset.k; ve(); });
    const qq = q.trim().toLowerCase();
    const ls = ds.filter(x => (!k || x.kenh === k) && (!qq || ((x.ten || '') + '\n' + (x.brief || '') + '\n' + (x.chude || '') + '\n' + (x.trung || '')).toLowerCase().includes(qq)));
    setH($('#lsL'), ls.length ? ls.slice(0, 150).map(x => `<div class="lsit ${mo === x.id ? 'on' : ''}">
      <button class="lshd" data-id="${esc(x.id)}"><b>${esc((x.ten || tenNhap(x)).slice(0, 90))}${x.loai === 'viet' ? '<span class="tag v">Claude viết</span>' : x.loai === 'nhap' ? '<span class="tag">nháp</span>' : ''}</b><span>${KENH[x.kenh] ? KENH[x.kenh].ic + ' ' + KENH[x.kenh].ten : ''} · ${ngayGio(x.t)} · ${esc(nhan(x))}</span></button>
      ${mo === x.id ? `<div class="lsbd">${x.trung ? `<p class="pnote">Trùng bài: <b>${esc(x.trung)}</b></p>${(x.goi_y || []).length ? `<div class="lsgy"><span>Chủ đề chưa làm:</span>${x.goi_y.map(g => `<button data-gy="${esc(g)}">${esc(g)}</button>`).join('')}</div>` : ''}` : `<pre>${esc(x.brief || (x.chude ? 'Chủ đề: ' + x.chude : ''))}</pre>`}
        <div class="acts">${x.brief ? '<button class="btn sm" data-chep>Chép</button>' : ''}${x.loai === 'bai' ? `<button class="btn sm" data-mo="${esc(x.id)}">Mở bài</button>` : x.bai ? `<button class="btn sm" data-mo="${esc(x.bai)}">Mở bài đã dựng</button>` : ''}${x.brief || x.chude ? '<button class="btn sm pri" data-dung>Dùng lại</button>' : ''}</div></div>` : ''}</div>`).join('')
      : `<p class="pnote">${ds.length ? 'Không có brief nào khớp.' : 'Chưa có brief nào.'}</p>`);
    m.querySelectorAll('.lshd').forEach(b => b.onclick = () => { mo = mo === b.dataset.id ? null : b.dataset.id; ve(); });
    const x = ds.find(y => y.id === mo); if (!x) return;
    const bd = m.querySelector('.lsit.on .lsbd'); if (!bd) return;
    const chep = bd.querySelector('[data-chep]'); if (chep) chep.onclick = () => navigator.clipboard.writeText(x.brief).then(() => toast('Đã chép brief'), () => toast('Không chép được', true));
    const mob = bd.querySelector('[data-mo]'); if (mob) mob.onclick = async () => { dong(); await loadJobs(); openJob(mob.dataset.mo); };
    const dung = bd.querySelector('[data-dung]'); if (dung) dung.onclick = () => { dong(); themNhap({kenh: KENH[x.kenh] ? x.kenh : S.form.kenh, brief: x.brief || '', chude: x.chude || ''}); toast('Đã mở thành nháp, sửa rồi bấm Chạy'); };
    bd.querySelectorAll('[data-gy]').forEach(g => g.onclick = () => { dong(); themNhap({kenh: KENH[x.kenh] ? x.kenh : S.form.kenh, chude: g.dataset.gy}); toast('Đã điền chủ đề vào nháp mới, bấm Viết brief'); });
  };
  $('#lsQ').oninput = e => { q = e.target.value; ve(); };
  ve(); $('#lsQ').focus();
}
async function tgChip(){
  const st = await api('/api/telegram').catch(() => null); if (!st) return;
  setH($('#bTg'), `<span class="dot ${st.xong ? 'ok' : ''}"></span><span>${st.xong ? 'Telegram: ' + esc(st.ten || '') : 'Cài Telegram'}</span>`);
}
/* ---------- chữ đậm, code, link trong nhật ký ---------- */
function inline(s){
  return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
}

/* ---------- bắt đầu ---------- */
$('#bNew').onclick = baiMoi;
$('#bTg').onclick = () => tgDialog(); tgChip();
$('#bQt').onclick = () => quyTac(); qtTai();
$('#bRm').onclick = () => remote();

$('#bCoSan').onclick = coSanDialog;
$('#bLs').onclick = lsDialog;
health(); Promise.all([loadJobs(), loadNhap()]).then(() => { const h = (location.hash.match(/bai=([\w-]+)/) || [])[1], moi = location.hash === '#moi'; const r = !moi && ((h && S.jobs.find(j => j.id === h)) || S.jobs.find(j => j.status === 'dang-chay')); r ? openJob(r.id) : newView(); });
setInterval(loadJobs, 5000); setInterval(() => health(), 120000);
</script>
